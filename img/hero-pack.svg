<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4289"/>
      <stop offset="1" stop-color="#0b2545"/>
    </linearGradient>
    <linearGradient id="o1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e8631b"/>
    </linearGradient>
    <linearGradient id="o2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#e8631b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fb0c8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2e7d94" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="560" height="480" rx="28" fill="url(#sky)"/>
  <g opacity=".35">
    <circle cx="80" cy="80" r="120" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="80" cy="80" r="160" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="480" cy="400" r="140" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- big label roll -->
  <g transform="translate(120 150)">
    <circle cx="0" cy="0" r="96" fill="#0d2a4a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="78" fill="url(#o1)"/>
    <circle cx="0" cy="0" r="30" fill="#0b2545"/>
    <circle cx="0" cy="0" r="14" fill="#f5a623"/>
    <!-- peeling label strip -->
    <path d="M78 -20 Q150 -40 172 -78" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <path d="M78 20 Q150 40 172 78" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- bottle with shrink sleeve -->
  <g transform="translate(330 120)">
    <rect x="-34" y="30" width="68" height="190" rx="20" fill="url(#glass)"/>
    <rect x="-34" y="30" width="68" height="190" rx="20" fill="none" stroke="#0b2545" stroke-width="2"/>
    <rect x="-14" y="120" width="28" height="100" rx="8" fill="#0b2545" opacity=".25"/>
    <path d="M-34 70 Q-34 120 0 150 Q34 120 34 70 Z" fill="url(#o2)" opacity=".95"/>
    <path d="M-34 70 Q0 40 34 70 Z" fill="#f5a623"/>
    <rect x="-18" y="-8" width="36" height="42" rx="10" fill="#071b33"/>
    <rect x="-10" y="0" width="20" height="6" rx="3" fill="#f5a623"/>
  </g>

  <!-- small box -->
  <g transform="translate(150 340)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#ffffff"/>
    <path d="M-40 -30 L0 -52 L40 -30" fill="none" stroke="#ffffff" stroke-width="6"/>
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="none" stroke="#0b2545" stroke-width="2"/>
    <path d="M-24 -14 h48 M-24 2 h48" stroke="#e8631b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- floating badges -->
  <g transform="translate(430 320)">
    <rect x="-72" y="-20" width="144" height="40" rx="20" fill="#ffffff"/>
    <circle cx="-48" cy="0" r="9" fill="#12b5a5"/>
    <path d="M-51.5 -1 l3 3 l5.5 -6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-28" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0b2545">جودة معتمدة</text>
  </g>
  <g transform="translate(90 60)">
    <rect x="-78" y="-20" width="156" height="40" rx="20" fill="#ffffff"/>
    <path d="M-56 -4 q6 -8 12 0 q-6 8 -12 0" fill="#e8631b"/>
    <text x="-34" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0b2545">تسليم سريع</text>
  </g>

  <!-- dashed flow line -->
  <path d="M250 440 Q340 410 420 430" fill="none" stroke="#f5a623" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".8"/>
</svg>
