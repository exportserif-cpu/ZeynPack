<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76e"/>
      <stop offset=".5" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#c77800"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13315c"/>
      <stop offset="1" stop-color="#071b33"/>
    </linearGradient>
  </defs>
  <ellipse cx="150" cy="200" rx="90" ry="12" fill="#0b2545" opacity=".12"/>
  <!-- premium label sheet -->
  <rect x="74" y="42" width="152" height="140" rx="14" fill="url(#spec)"/>
  <rect x="74" y="42" width="152" height="140" rx="14" fill="none" stroke="#1d4289" stroke-width="2"/>
  <!-- hot foil emblem -->
  <circle cx="150" cy="92" r="26" fill="url(#gold)"/>
  <circle cx="150" cy="92" r="20" fill="none" stroke="#7a4a00" stroke-width="1.5" opacity=".6"/>
  <path d="M150 76 l4.6 9.3 10.2 1.5 -7.4 7.2 1.8 10.2 -9.2 -4.8 -9.2 4.8 1.8 -10.2 -7.4 -7.2 10.2 -1.5 z" fill="#7a4a00" opacity=".85"/>
  <!-- embossed text lines -->
  <rect x="104" y="132" width="92" height="7" rx="3.5" fill="url(#gold)"/>
  <rect x="118" y="147" width="64" height="6" rx="3" fill="#f5a623" opacity=".55"/>
  <!-- corner flourish -->
  <path d="M88 56 q-8 14 4 22 M212 56 q8 14 -4 22" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M88 168 q-8 -14 4 -22 M212 168 q8 -14 -4 -22" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- sparkles -->
  <g fill="#ffd76e">
    <path d="M236 52 l2.4 5.2 5.6 .8 -4 4 1 5.6 -5 -2.6 -5 2.6 1 -5.6 -4 -4 5.6 -.8 z"/>
    <path d="M58 150 l2 4.3 4.6 .7 -3.3 3.3 .8 4.6 -4.1 -2.2 -4.1 2.2 .8 -4.6 -3.3 -3.3 4.6 -.7 z"/>
  </g>
  <text x="150" y="196" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#e8631b">SPECIALTY / FOIL</text>
</svg>
